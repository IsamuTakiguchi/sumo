name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # マージ前に確認したいときは Actions タブから手動実行できる
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のデプロイは中断せず待つ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 静的書き出し
        run: npm run build
        env:
          NEXT_OUTPUT: export
          # https://<user>.github.io/sumo/ で公開するため、サブパスを付ける
          NEXT_BASE_PATH: /sumo
          # ここは内蔵シンセ専用の無料版。静的書き出しでは /api/music が存在しないので、
          # NEXT_PUBLIC_AI_PROVIDER_ENABLED は絶対に設定しないこと。
          # 設定すると UI に AI の選択肢が出て、選んでも 404 になる。
          # AI 生成つきの版は Railway 側にデプロイしている。
          # OGP 画像の URL を絶対パスにするために公開先を渡す。
          # basePath（/sumo）は Next 側が付けるので、ここではオリジンだけ。
          # 付けると og:image が /sumo/sumo/... と二重になる
          NEXT_PUBLIC_SITE_URL: https://isamutakiguchi.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
